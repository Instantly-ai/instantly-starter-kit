[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instantly-sdk"
version = "0.1.0"
description = "Typed Python SDK for the Instantly API v2, generated from the OpenAPI spec."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Instantly" }]
keywords = ["instantly", "email", "outreach", "cold-email", "sdk", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Instantly-ai/instantly-starter-kit"

[tool.setuptools.packages.find]
where = ["."]
include = ["instantly*"]
